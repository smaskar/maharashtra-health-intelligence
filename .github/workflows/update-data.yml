name: Collect health intelligence
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_news.py
      - name: Commit review queue
        run: |
          git config user.name "nhm-health-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/review_queue.json
          git diff --cached --quiet || git commit -m "chore: refresh public news review queue"
          git push
